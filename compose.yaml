services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: sauron, POSTGRES_PASSWORD: sauron, POSTGRES_DB: sauron }
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sauron']
      interval: 2s
      retries: 15

  # Les dossiers à analyser sont montés en lecture seule au même chemin que sur l'hôte.
  web:
    build: { context: ., target: web }
    ports: ['8080:8080']
    environment:
      DATABASE_URL: postgres://sauron:sauron@db:5432/sauron
      SAURON_ROOTS: ${PROJECTS_DIR:-${HOME}/Dev}
    volumes: ['${PROJECTS_DIR:-${HOME}/Dev}:${PROJECTS_DIR:-${HOME}/Dev}:ro']
    depends_on: { db: { condition: service_healthy } }

  # Hot reload : docker compose up dev (http://localhost:5173). Sources montées, node_modules reste celui de l'image.
  dev:
    build: { context: ., target: dev }
    profiles: [dev]
    ports: ['5173:5173']
    environment:
      DATABASE_URL: postgres://sauron:sauron@db:5432/sauron
      SAURON_ROOTS: ${PROJECTS_DIR:-${HOME}/Dev}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.svelte-kit
      - '${PROJECTS_DIR:-${HOME}/Dev}:${PROJECTS_DIR:-${HOME}/Dev}:ro'
    depends_on: { db: { condition: service_healthy } }

  # Usage : REPO=../mon-repo docker compose run --rm cli analyze .
  cli:
    build: { context: ., target: cli }
    profiles: [cli]
    volumes: ['${REPO:-.}:/repo']

volumes:
  pgdata:
