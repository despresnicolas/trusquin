<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trusquin</title>
    <script>
      // Thème choisi dans les réglages, appliqué avant le rendu pour éviter un flash.
      try {
        // Clés de l'ancien nom de l'application (SAURON), reprises une fois.
        for (const key of Object.keys(localStorage)) {
          if (!key.startsWith('sauron:')) continue;
          const next = 'trusquin:' + key.slice(7);
          if (localStorage.getItem(next) === null) localStorage.setItem(next, localStorage.getItem(key));
          localStorage.removeItem(key);
        }
        const theme = localStorage.getItem('trusquin:theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
