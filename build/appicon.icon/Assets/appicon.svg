<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- L'invite d'un terminal « >_ » : le trusquin trace le curseur, c'est-à-dire la prochaine consigne pour Claude Code. -->
  <defs>
    <linearGradient id="joue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EDBB80"/>
      <stop offset="1" stop-color="#C4844A"/>
    </linearGradient>
    <linearGradient id="tige" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E2BC"/>
      <stop offset="1" stop-color="#DDB27C"/>
    </linearGradient>
    <linearGradient id="trait" x1="410" y1="0" x2="812" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8835F"/>
      <stop offset="1" stop-color="#FFC58A"/>
    </linearGradient>
    <radialGradient id="lueur" cx="800" cy="690" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB923C" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(512 512) scale(1.15) translate(-514 -543)">
  <!-- Le chevron de l'invite -->
  <path d="M196 428 L356 540 L196 652" fill="none" stroke="#D97757" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Le curseur, tracé par la pointe -->
  <circle cx="800" cy="690" r="80" fill="url(#lueur)"/>
  <rect x="410" y="676" width="402" height="30" rx="15" fill="url(#trait)"/>

  <!-- Le trusquin -->
  <g transform="translate(337 241) scale(.6)">
    <rect x="176" y="436" width="690" height="100" rx="22" fill="url(#tige)"/>
    <path d="M500 466 H830 M540 504 H790" stroke="#C4935A" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <path d="M750 530 H794 L772 748 Z" fill="#E7E5E4"/>
    <rect x="286" y="296" width="176" height="392" rx="28" fill="url(#joue)"/>
    <path d="M318 330 V654" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/>
    <rect x="358" y="232" width="32" height="72" rx="8" fill="#D6D3D1"/>
    <circle cx="374" cy="226" r="46" fill="#E7E5E4"/>
    <circle cx="374" cy="226" r="17" fill="#A8A29E"/>
  </g>
  </g>
</svg>
