name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Pour les tests d'intégration de db.test.ts (sinon ignorés).
      db:
        image: postgres:17-alpine
        env: { POSTGRES_USER: sauron, POSTGRES_PASSWORD: sauron, POSTGRES_DB: sauron }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U sauron" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://sauron:sauron@localhost:5432/sauron
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
