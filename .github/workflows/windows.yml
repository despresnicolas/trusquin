name: Windows

# Compatibilité Windows 11 : tests (dont Go sous Windows), installeur NSIS, installation silencieuse,
# démarrage puis désinstallation. Runner windows-2025 : même base que Windows 11 24H2 (le runner windows-11-arm
# n'est proposé qu'aux dépôts publics).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows 11 (Server 2025, x64)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # Le paquet choco n'ajoute pas makensis au PATH.
      - run: |
          choco install nsis -y --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Installeur NSIS
        run: |
          wails3 package
          Get-ChildItem bin

      # Même script que la vérification des installeurs publiés (release.yml).
      - run: ./build/windows/check.ps1 (Get-ChildItem bin\*-installer.exe | Select-Object -First 1).FullName
